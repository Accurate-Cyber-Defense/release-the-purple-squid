version: '3.8'

services:
  squidbot:
    build:
      context: .
      dockerfile: Dockerfile.alpine
    container_name: squidbot-v5
    hostname: squidbot
    restart: unless-stopped
    privileged: true  # Required for network spoofing features
    network_mode: host  # For full network access
    volumes:
      - ./data:/app/.squidbot
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - SQUIDBOT_ENV=production
      - LOG_LEVEL=INFO
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Optional: Redis for caching
  redis:
    image: redis:alpine
    container_name: squidbot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-squidbot}

  # Optional: PostgreSQL for extended storage
  postgres:
    image: postgres:15-alpine
    container_name: squidbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: squidbot
      POSTGRES_USER: squidbot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-squidbot123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Optional: Nginx for phishing pages
  nginx:
    image: nginx:alpine
    container_name: squidbot-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./phishing-pages:/usr/share/nginx/html/phishing:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - squidbot

volumes:
  redis-data:
  postgres-data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16